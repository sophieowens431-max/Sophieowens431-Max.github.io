<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophie 的个人主页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.1em;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .links a {
            display: inline-block;
            margin: 8px 12px;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }
        .links a:hover {
            background: #3a7bd5;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.85em;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sophie</h1>
        <div class="subtitle">个人主页 · 正在学习与探索</div>
        
        <div class="links">
            <a href="https://github.com/Sophieowens431-Max" target="_blank">GitHub</a>
            <a href="#" target="_blank">Telegram</a>
            <a href="#" target="_blank">导航页</a>
        </div>

        <div class="footer">
            以后这里会放文章和图片
        </div>
    </div>
</body>
</html>
